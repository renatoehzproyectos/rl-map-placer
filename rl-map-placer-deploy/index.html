<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL Map Placer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#12141a;--panel:#1b1e27;--fg:#e8e8ec;--accent:#4da3ff;--line:#2a2e3a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Roboto,Arial,sans-serif;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#viewport{position:fixed;inset:0;touch-action:none;}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:8px 10px;background:rgba(18,20,26,.85);
  display:flex;gap:6px;align-items:center;z-index:5;font-size:13px;}
#top select{flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;}
#top button{background:var(--accent);color:#04101f;border:none;border-radius:8px;padding:7px 10px;font-weight:600;font-size:12px;}
#panel{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;background:rgba(18,20,26,.92);
  border-top:1px solid var(--line);padding:8px 10px 10px;z-index:5;max-height:46vh;overflow-y:auto;}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;}
.row label{width:16px;font-size:12px;opacity:.8;}
.row input[type=range]{flex:1;}
.row input[type=number]{width:64px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;}
.grp{font-size:11px;text-transform:uppercase;opacity:.55;margin:8px 0 2px;letter-spacing:.05em;}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.btnrow button{flex:1;min-width:70px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:12px;}
.btnrow button.primary{background:var(--accent);color:#04101f;border:none;font-weight:700;}
#jsonBox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;flex-direction:column;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));}
#jsonBox textarea{flex:1;background:#0c0d11;color:#9fe39f;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;}
#jsonBox .btnrow{margin-top:8px;}
#hint{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));left:8px;font-size:11px;opacity:.5;z-index:4;pointer-events:none;}
</style>
</head>
<body>
<div id="viewport"></div>
<div id="hint">1 dedo: orbitar · 2 dedos: pan/zoom</div>
<div id="top">
  <select id="meshSel"></select>
  <button id="doneBtn">✓</button>
  <button id="exportBtn">JSON</button>
</div>
<div id="panel">
  <div class="grp">Posición</div>
  <div class="row"><label>X</label><input type="range" id="pxr" min="-4000" max="4000" step="1"><input type="number" id="px"></div>
  <div class="row"><label>Y</label><input type="range" id="pyr" min="-4000" max="4000" step="1"><input type="number" id="py"></div>
  <div class="row"><label>Z</label><input type="range" id="pzr" min="-2000" max="2000" step="1"><input type="number" id="pz"></div>
  <div class="grp">Rotación (grados)</div>
  <div class="row"><label>Y</label><input type="range" id="ryr" min="-180" max="180" step="1"><input type="number" id="ry"></div>
  <div class="row"><label>X</label><input type="range" id="rxr" min="-180" max="180" step="1"><input type="number" id="rx"></div>
  <div class="row"><label>Z</label><input type="range" id="rzr" min="-180" max="180" step="1"><input type="number" id="rz"></div>
  <div class="grp">Escala</div>
  <div class="row"><label>S</label><input type="range" id="scr" min="0.05" max="10" step="0.01"><input type="number" id="sc"></div>
  <div class="btnrow">
    <button id="rangeBtn">Rango ±20000</button>
    <button id="resetBtn">Reset mesh</button>
    <button id="hideBtn">Ocultar/mostrar</button>
  </div>
</div>
<div id="jsonBox">
  <textarea id="jsonTa" readonly></textarea>
  <div class="btnrow">
    <button class="primary" id="copyBtn">Copiar</button>
    <button id="closeJsonBtn">Cerrar</button>
  </div>
</div>

AAAYAAAAGEAAABiAAAAYgAAAGMAAABgAAAAXAAAAF0AAABeAAAAXgAAAF8AAABcAAAAWAAAAFkAAABaAAAAWgAAAFsAAABYAAAAVAAAAFUAAABWAAAAVgAAAFcAAABUAAAAUAAAAFEAAABSAAAAUgAAAFMAAABQAAAATAAAAE0AAABOAAAATgAAAE8AAABMAAAASAAAAEkAAABKAAAASgAAAEsAAABIAAAARAAAAEUAAABGAAAARgAAAEcAAABEAAAAQAAAAEEAAABCAAAAQgAAAEMAAABAAAAAPAAAAD0AAAA+AAAAPgAAAD8AAAA8AAAAOAAAADkAAAA6AAAAOgAAADsAAAA4AAAAGQAAABoAAAAbAAAAGwAAABwAAAAZAAAAFQAAABYAAAAXAAAAFwAAABgAAAAVAAAAEwAAABQAAAARAAAAEQAAABIAAAATAAAAJgAAACcAAAAkAAAAJAAAACUAAAAmAAAAmAAAAJkAAACaAAAABgAAAAcAAAAIAAAAmwAAAJwAAACdAAAAAwAAAAQAAAAFAAAAngAAAJ8AAACgAAAAAAAAAAEAAAACAAAAoQAAAKIAAACjAAAAeQEAAHoBAAB7AQAApAAAAKUAAACmAAAAUQEAAFIBAABTAQAArwAAALAAAACxAAAAPQEAAD4BAAA/AQAAugAAALsAAAC8AAAAMAEAADEBAAAyAQAAvQAAAL4AAAC/AAAAyQAAAMoAAADLAAAAwAAAAMEAAADCAAAAxgAAAMcAAADIAAAAwwAAAMQAAADFAAAA", "nv": 380, "ni": 540}};
const names = Object.keys(MESH_DATA);

function b64ToF32(b64){
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i=0;i<bin.length;i++) view[i]=bin.charCodeAt(i);
  return new Float32Array(buf);
}
function b64ToU32(b64){
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i=0;i<bin.length;i++) view[i]=bin.charCodeAt(i);
  return new Uint32Array(buf);
}
function hashColor(name){
  let h=0; for(let i=0;i<name.length;i++){h=(h*31+name.charCodeAt(i))|0;}
  const hue=((h%360)+360)%360;
  const c=new THREE.Color(); c.setHSL(hue/360,0.55,0.55);
  return c;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 200000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(1,2,1); scene.add(dl);
const grid = new THREE.GridHelper(20000, 40, 0x3a4050, 0x22262f);
grid.rotation.x = Math.PI/2; // XY ground plane (Z up, Unreal-style)
scene.add(grid);
const axes = new THREE.AxesHelper(500); scene.add(axes);

const objects = {};
const state = {};
for (const name of names){
  const d = MESH_DATA[name];
  const pos = b64ToF32(d.p);
  const idx = b64ToU32(d.i);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({color:hashColor(name), side:THREE.DoubleSide, roughness:0.85});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.visible = false;
  scene.add(mesh);
  objects[name] = mesh;
  state[name] = {x:0,y:0,z:0,rx:0,ry:0,rz:0,s:1,visible:false,placed:false};
}

// restore saved state
try {
  const saved = localStorage.getItem('rl_placer_state');
  if (saved){
    const parsed = JSON.parse(saved);
    for (const k in parsed){ if (state[k]) Object.assign(state[k], parsed[k]); }
  }
} catch(e){ console.warn('no saved state', e); }

function applyState(name){
  const s = state[name], o = objects[name];
  o.position.set(s.x,s.y,s.z);
  o.rotation.set(s.rx*Math.PI/180, s.ry*Math.PI/180, s.rz*Math.PI/180);
  o.scale.setScalar(s.s);
  o.visible = s.visible;
}
for (const n of names) applyState(n);

function saveState(){
  try { localStorage.setItem('rl_placer_state', JSON.stringify(state)); } catch(e){}
}

// camera orbit (simple touch/mouse)
let camDist=3000, camTheta=0.9, camPhi=1.0, camTarget=new THREE.Vector3(0,0,300);
function updateCam(){
  const x = camTarget.x + camDist*Math.sin(camPhi)*Math.cos(camTheta);
  const y = camTarget.y + camDist*Math.sin(camPhi)*Math.sin(camTheta);
  const z = camTarget.z + camDist*Math.cos(camPhi);
  camera.position.set(x,y,z);
  camera.up.set(0,0,1);
  camera.lookAt(camTarget);
}
updateCam();

let pointers = {};
let lastPan = null, lastPinchDist=null;
const vp = document.getElementById('viewport');
vp.addEventListener('pointerdown', e=>{ pointers[e.pointerId]={x:e.clientX,y:e.clientY}; vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointerup', e=>{ delete pointers[e.pointerId]; lastPan=null; lastPinchDist=null; });
vp.addEventListener('pointercancel', e=>{ delete pointers[e.pointerId]; lastPan=null; lastPinchDist=null; });
vp.addEventListener('pointermove', e=>{
  if (!(e.pointerId in pointers)) return;
  const prev = pointers[e.pointerId];
  pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
  const ids = Object.keys(pointers);
  if (ids.length === 1){
    const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
    camTheta -= dx*0.005;
    camPhi = Math.max(0.05, Math.min(Math.PI-0.05, camPhi - dy*0.005));
    updateCam();
  } else if (ids.length === 2){
    const p = ids.map(id=>pointers[id]);
    const dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    const cx=(p[0].x+p[1].x)/2, cy=(p[0].y+p[1].y)/2;
    if (lastPinchDist){
      camDist *= lastPinchDist/dist;
      camDist = Math.max(50, Math.min(50000, camDist));
    }
    lastPinchDist = dist;
    if (lastPan){
      const dx=(cx-lastPan.x)*camDist*0.0015, dy=(cy-lastPan.y)*camDist*0.0015;
      const right = new THREE.Vector3(Math.sin(camTheta+Math.PI/2),Math.cos(camTheta+Math.PI/2),0);
      const up = new THREE.Vector3(0,0,1);
      camTarget.addScaledVector(right, -dx);
      camTarget.addScaledVector(up, dy);
    }
    lastPan = {x:cx,y:cy};
    updateCam();
  }
});
vp.addEventListener('wheel', e=>{ camDist = Math.max(50, Math.min(50000, camDist * (1+e.deltaY*0.001))); updateCam(); });

function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// UI wiring
const sel = document.getElementById('meshSel');
for (const n of names){ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); }
let current = names[0];

const fields = [
  ['px','pxr','x',1], ['py','pyr','y',1], ['pz','pzr','z',1],
  ['rx','rxr','rx',1], ['ry','ryr','ry',1], ['rz','rzr','rz',1],
  ['sc','scr','s',1],
];
function refreshUI(){
  const s = state[current];
  for (const [numId, rngId, key] of fields){
    document.getElementById(numId).value = s[key];
    document.getElementById(rngId).value = s[key];
  }
}
function wireField(numId, rngId, key){
  const num = document.getElementById(numId), rng = document.getElementById(rngId);
  function set(v){
    v = parseFloat(v); if (isNaN(v)) return;
    state[current][key] = v; state[current].placed = true;
    applyState(current); saveState();
  }
  num.addEventListener('input', ()=>{ rng.value=num.value; set(num.value); });
  rng.addEventListener('input', ()=>{ num.value=rng.value; set(rng.value); });
}
for (const [numId, rngId, key] of fields) wireField(numId, rngId, key);

sel.addEventListener('change', ()=>{ current = sel.value; state[current].visible = true; applyState(current); refreshUI(); });
document.getElementById('doneBtn').addEventListener('click', ()=>{
  const idx = names.indexOf(current);
  const next = names[(idx+1) % names.length];
  sel.value = next; current = next; state[current].visible = true; applyState(current); refreshUI();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  Object.assign(state[current], {x:0,y:0,z:0,rx:0,ry:0,rz:0,s:1});
  applyState(current); refreshUI(); saveState();
});
document.getElementById('hideBtn').addEventListener('click', ()=>{
  state[current].visible = !state[current].visible; applyState(current); saveState();
});
document.getElementById('rangeBtn').addEventListener('click', ()=>{
  document.getElementById('pxr').min=-20000; document.getElementById('pxr').max=20000;
  document.getElementById('pyr').min=-20000; document.getElementById('pyr').max=20000;
  document.getElementById('pzr').min=-8000; document.getElementById('pzr').max=8000;
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const out = {};
  for (const n of names){ if (state[n].placed) out[n] = state[n]; }
  document.getElementById('jsonTa').value = JSON.stringify(out, null, 1);
  document.getElementById('jsonBox').style.display = 'flex';
});
document.getElementById('closeJsonBtn').addEventListener('click', ()=>{
  document.getElementById('jsonBox').style.display = 'none';
});
document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const ta = document.getElementById('jsonTa');
  ta.select();
  try { await navigator.clipboard.writeText(ta.value); document.getElementById('copyBtn').textContent='Copiado!'; }
  catch(e){ document.execCommand('copy'); }
  setTimeout(()=>{ document.getElementById('copyBtn').textContent='Copiar'; }, 1200);
});

state[current].visible = true; applyState(current); refreshUI();
</script>
